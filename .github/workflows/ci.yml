name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,ml,api,ui]"

      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        run: python -m mypy src

      - name: Security scan
        # B311 is intentional: seeded randomness makes ML splits reproducible,
        # and is never used for credentials or cryptography.
        run: python -m bandit -q -r src -s B311

      - name: Test with coverage
        run: python -m pytest

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize infra/k8s/base \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
                -strict -summary

      - name: Validate monitoring configuration
        run: |
          python -m json.tool \
            infra/monitoring/grafana/dashboards/pneumonia-api.json >/dev/null
          docker run --rm \
            -v "$PWD/infra/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.11.3 \
            check config /etc/prometheus/prometheus.yml

  containers:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["api", "ui"]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          # load=true keeps the image in the local daemon for the smoke job below
          load: ${{ matrix.target == 'api' }}
          platforms: ${{ matrix.target == 'api' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: pneumonia-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  smoke:
    # Boot the api container against an untrained checkpoint and verify the
    # static endpoints answer. The checkpoint is randomly initialised: we assert
    # that the service starts and that /health + /metrics respond, not that the
    # predictions are meaningful. Starting without any checkpoint made
    # PredictionService raise FileNotFoundError mid-startup, which raced the
    # health check and produced intermittent "connection reset" (curl 56).
    needs: containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Rebuild api image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          platforms: linux/amd64
          tags: pneumonia-api:ci
          cache-from: type=gha,scope=api

      - name: Generate an untrained checkpoint
        run: |
          mkdir -p models/baseline
          docker run --rm --user root \
            -v "$PWD/models:/app/models" \
            -v "$PWD/scripts:/app/scripts:ro" \
            pneumonia-api:ci \
            python scripts/ci_smoke_checkpoint.py models/baseline/best_model.pt

      - name: Start api container
        run: |
          docker run -d \
            --name api-smoke \
            -p 8000:8000 \
            -e APP_ENV=test \
            -v "$PWD/models:/app/models:ro" \
            pneumonia-api:ci
          for _ in $(seq 1 30); do
            docker logs api-smoke 2>&1 | grep -q "Application startup complete" && break
            if ! docker ps --filter "name=api-smoke" --filter "status=running" | grep -q api-smoke; then
              echo "Container exited before startup completed"
              docker logs api-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs api-smoke

      - name: Verify static endpoints
        run: |
          curl --retry 10 --retry-delay 2 --retry-connrefused --fail --show-error \
            http://localhost:8000/health
          echo
          curl --retry 5 --retry-delay 2 --retry-connrefused --fail --show-error \
            http://localhost:8000/metrics >/dev/null
          echo "Smoke endpoints OK"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs api-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f api-smoke || true
