[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pneumonia-platform"
version = "0.1.0"
description = "Plateforme académique de détection de pneumonie sur radiographies thoraciques."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary - Academic project" }
authors = [{ name = "PFE2 Team" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10.4,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.27,<0.29",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
data = [
  "albumentations>=1.4,<3",
  "boto3>=1.35,<2",
  "kagglehub>=0.3,<1",
  "opencv-python-headless>=4.10,<5",
  "psycopg[binary]>=3.2,<4",
]
ml = [
  "mlflow>=2.16,<4",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]
api = [
  # Keep the Starlette/TestClient combination compatible with httpx.
  # Future Starlette 1.x releases currently require the unavailable httpx2 package.
  "fastapi>=0.115,<0.116",
  "starlette>=0.40,<0.47",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]
ui = ["requests>=2.32,<3", "streamlit>=1.38,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/pneumonia"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.test-tmp -p no:cacheprovider --cov=src/pneumonia --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Script generateur du cahier des charges (document Word) : long texte FR et
# imports qui varient a chaque regeneration -> exclu du lint et du format.
extend-exclude = ["scripts/export_docx_cahier_des_charges.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generateur du cahier des charges : longues phrases FR (E501) et
# typographie francaise volontaire dans le document Word produit (RUF001).
"scripts/export_docx_cahier_des_charges.py" = ["E501", "RUF001", "I001", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pneumonia"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["kagglehub", "sklearn.*", "torchvision.*"]
ignore_missing_imports = true

[project.scripts]
pneumonia-data = "pneumonia.data.cli:main"
pneumonia-train = "pneumonia.training.train:main"
pneumonia-compare = "pneumonia.training.compare:main"
pneumonia-evaluate = "pneumonia.evaluation.evaluate:main"
