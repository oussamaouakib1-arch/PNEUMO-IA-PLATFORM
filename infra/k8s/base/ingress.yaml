apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pneumonia-platform
  namespace: pneumonia
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.pneumonia.example.com
        - api.pneumonia.example.com
      secretName: pneumonia-tls
  rules:
    - host: app.pneumonia.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pneumonia-ui
                port:
                  name: http
    - host: api.pneumonia.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pneumonia-api
                port:
                  name: http
