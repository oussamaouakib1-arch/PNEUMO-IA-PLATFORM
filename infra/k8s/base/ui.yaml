apiVersion: apps/v1
kind: Deployment
metadata:
  name: pneumonia-ui
  namespace: pneumonia
  labels:
    app.kubernetes.io/name: pneumonia-ui
    app.kubernetes.io/part-of: pneumonia-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pneumonia-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pneumonia-ui
        app.kubernetes.io/part-of: pneumonia-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/oussamaouakib1-arch/PNEUMO-IA-PLATFORM/pneumonia-ui:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pneumonia-config
          ports:
            - name: http
              containerPort: 8501
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: streamlit-state
              mountPath: /app/.streamlit
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: streamlit-state
          emptyDir:
            sizeLimit: 16Mi
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pneumonia-ui
  namespace: pneumonia
  labels:
    app.kubernetes.io/name: pneumonia-ui
spec:
  selector:
    app.kubernetes.io/name: pneumonia-ui
  ports:
    - name: http
      port: 8501
      targetPort: http
