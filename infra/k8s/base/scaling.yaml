apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pneumonia-api
  namespace: pneumonia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pneumonia-api
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pneumonia-ui
  namespace: pneumonia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pneumonia-ui
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pneumonia-api
  namespace: pneumonia
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pneumonia-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pneumonia-ui
  namespace: pneumonia
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pneumonia-ui
